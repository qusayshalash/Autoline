name: CI

# The suite has only ever run on one Windows machine. Running it on Linux for every
# push is half the point of having it: path handling, file encodings and DuckDB's
# timestamp behaviour are all things that can differ per platform and would otherwise
# be discovered by whoever next clones the repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # The `real` tests read the maintainer's 4.1M-row dataset, which is not in the
        # repository and never will be; they skip themselves when it is absent, but
        # deselecting them keeps the run honest about what it covered.
        run: pytest -m "not real" -q
        env:
          # The tests point DATA_DIR at a temp directory of their own, but a runner
          # without a HOME-relative default would fall back to writing inside the
          # checkout. Naming it explicitly keeps that from ever mattering.
          PYTHONUTF8: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`. The root tsconfig.json is a solution file of
      # project references, and --noEmit against it type-checks nothing at all - it
      # passed twice on code that the build then rejected.
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b --force

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
